name: Build TV APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK Platform & Build Tools
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | sdkmanager --licenses 2>/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build Deepedu TV APK
        working-directory: android-tv
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ../build-deepedu.log
        continue-on-error: true

      - name: Build ManimCat TV APK
        working-directory: android-tv-manimcat
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ../build-manimcat.log
        continue-on-error: true

      - name: Collect results
        run: |
          mkdir -p static/apk
          [ -f android-tv/app/build/outputs/apk/release/app-release-unsigned.apk ] && cp android-tv/app/build/outputs/apk/release/app-release-unsigned.apk static/apk/deepedu-tv.apk || true
          [ -f android-tv/app/build/outputs/apk/release/app-release.apk ] && cp android-tv/app/build/outputs/apk/release/app-release.apk static/apk/deepedu-tv.apk || true
          [ -f android-tv-manimcat/app/build/outputs/apk/release/app-release-unsigned.apk ] && cp android-tv-manimcat/app/build/outputs/apk/release/app-release-unsigned.apk static/apk/manimcat-tv.apk || true
          [ -f android-tv-manimcat/app/build/outputs/apk/release/app-release.apk ] && cp android-tv-manimcat/app/build/outputs/apk/release/app-release.apk static/apk/manimcat-tv.apk || true
          ls -la static/apk/ || echo "No APKs produced"

      - name: Commit and push APKs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/apk/ build-deepedu.log build-manimcat.log || true
          git diff --staged --quiet || git commit -m "chore: auto-build TV APKs [skip ci]"
          git push
