name: Build TV APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Deepedu TV APK
        working-directory: android-tv
        run: gradle assembleRelease

      - name: Build ManimCat TV APK
        working-directory: android-tv-manimcat
        run: gradle assembleRelease

      - name: Copy APKs to static
        run: |
          mkdir -p static/apk
          cp android-tv/app/build/outputs/apk/release/app-release.apk static/apk/deepedu-tv.apk
          cp android-tv-manimcat/app/build/outputs/apk/release/app-release.apk static/apk/manimcat-tv.apk

      - name: Commit and push APKs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/apk/
          git diff --staged --quiet || git commit -m "chore: auto-build TV APKs [skip ci]"
          git push
