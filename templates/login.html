<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 广电算力生态平台</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <h2>广电算力生态平台</h2>
      <p class="login-subtitle">使用广电宽带账号一键登录</p>

      {% if error %}
      <div class="alert alert-error">{{ error }}</div>
      {% endif %}

      <form method="post" action="/login">
        <div class="form-group">
          <label>用户名</label>
          <input type="text" name="username" class="form-input" placeholder="请输入用户名" required autofocus>
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" name="password" class="form-input" placeholder="请输入密码" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; padding:12px; font-size:16px;">登 录</button>
      </form>

      <div style="margin-top:20px; padding:12px; background:#f0f9ff; border-radius:8px; font-size:12px; color:var(--gray-600);">
        <strong>测试账号：</strong><br>
        管理员：admin / admin123<br>
        开发者：developer01 / dev123<br>
        普通用户：user01 / user123
      </div>

      <p style="text-align:center; margin-top:20px; font-size:12px; color:var(--gray-400);">
        <a href="/">返回首页</a>
      </p>
    </div>
  </div>
</body>
</html>
