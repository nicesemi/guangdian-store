{% extends "base.html" %}
{% block title %}提交Skill - 开放平台{% endblock %}
{% block page_title %}提交新Skill{% endblock %}

{% block content %}
<div class="card" style="max-width:700px;">
  <div class="card-header">Skill信息填写</div>
  <div class="card-body">
    <form id="skill-form">
      <div class="form-group">
        <label>Skill名称 *</label>
        <input type="text" class="form-input" name="name" placeholder="为你的Skill起个名字" required>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>分类 *</label>
          <select class="form-select" name="category" required>
            <option value="">请选择</option>
            <option value="教育">教育</option>
            <option value="办公">办公</option>
            <option value="创意">创意</option>
            <option value="生活">生活</option>
            <option value="广电特色">广电特色</option>
          </select>
        </div>
        <div class="form-group">
          <label>绑定模型</label>
          <select class="form-select" name="model_id">
            <option value="">不绑定模型</option>
            {% for model in models %}
            <option value="{{ model.id }}">{{ model.name }} ({{ model.type }})</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>定价 (¥)</label>
          <input type="number" class="form-input" name="price" value="0" step="0.01" min="0">
        </div>
        <div class="form-group">
          <label>计费模式</label>
          <select class="form-select" name="pricing_type">
            <option value="free">免费</option>
            <option value="paid">一次性付费</option>
            <option value="subscription">按月订阅</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>参数配置 (JSON)</label>
        <textarea class="form-textarea" name="config" placeholder='{"max_tokens": 500, "temperature": 0.7}' style="min-height:80px; font-family:monospace;"></textarea>
      </div>
      <div class="form-group">
        <label>详细描述 *</label>
        <textarea class="form-textarea" name="description" placeholder="详细说明Skill的功能、使用方法、适用场景等..." required></textarea>
      </div>
      <button type="submit" class="btn btn-primary">提交审核</button>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('skill-form').addEventListener('submit', function(e) {
  e.preventDefault();
  alert('Skill提交功能演示：已收到您的提交，进入审核流程。\n\n1. 自动测试 → 2. 人工审核 → 3. 上架商城');
});
</script>
{% endblock %}
